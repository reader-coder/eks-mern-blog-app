apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-test
  namespace: mern-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alb-test
  template:
    metadata:
      labels:
        app: alb-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: alb-test
  namespace: mern-blog
spec:
  type: ClusterIP
  selector:
    app: alb-test
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-test
  namespace: mern-blog
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alb-test
                port:
                  number: 80